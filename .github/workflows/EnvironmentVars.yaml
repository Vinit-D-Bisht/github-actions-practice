name: Environment Variables

on:
  workflow_dispatch:

env:
  APP_NAME: myapp

jobs:
  demo:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: staging

    steps:
      - name: Print Variables
        env:
          VERSION: 1.0.0
        run: |
          echo "App: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Version: $VERSION"

      - name: Print GitHub Context Variables
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
