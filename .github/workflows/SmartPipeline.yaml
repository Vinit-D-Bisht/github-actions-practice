name: Smart Pipeline

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - run: echo "Linting Code"

  test:
    runs-on: ubuntu-latest

    steps:
      - run: echo "Running Tests"

  summary:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Branch Type
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Main Branch Push"
          else
            echo "Feature Branch Push"
          fi

      - name: Commit Message
        run: echo "${{ github.event.commits[0].message }}"
